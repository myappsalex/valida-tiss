<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Meu Painel - ValidaTISS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .dashboard { background: white; padding: 30px; border-radius: 8px; max-width: 1000px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-primary { background: #0056b3; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #666; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    </style>
    <!-- PROTEÇÃO DE ROTA (Apenas Clientes) -->
    <script>
        const sessao = JSON.parse(sessionStorage.getItem('sessaoTISS'));
        if (!sessao || sessao.tipo === "INTERNO") {
            alert("Acesso exclusivo para clientes. Redirecionando...");
            window.location.href = "index.html";
        }
    </script>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div>
                <h2 style="margin: 0;">📊 Meu Painel - <span id="nome-empresa-painel">Empresa</span></h2>
                <p style="margin: 5px 0 0 0; color: #666;">Saldo Atual: <strong id="saldo-tokens-painel" style="color: #0056b3; font-size: 18px;">0</strong> Tokens IA</p>
            </div>
            <div>
                <button class="btn btn-primary" onclick="window.location.href='index.html'">Voltar ao Validador</button>
                <button class="btn btn-danger" onclick="efetuarLogout()">Sair</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
            <h3 style="margin: 0; color: #333;">⚙️ As Minhas Regras de Negócio Customizadas</h3>
            <button class="btn btn-success" onclick="abrirModalNovaRegra()">+ Criar Nova Regra</button>
        </div>
        <p style="font-size: 13px; color: #666;">Crie gatilhos para que o validador bloqueie ou alerte guias que saiam do padrão do seu contrato antes do envio.</p>

        <table>
            <thead>
                <tr>
                    <th>Nome da Regra</th>
                    <th>Alvo</th>
                    <th>Condição</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="lista-regras-body">
                <tr><td colspan="4" style="text-align: center;">A carregar regras...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- MODAL: NOVA REGRA -->
    <div id="modalNovaRegra" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #28a745;">Criar Gatilho de Validação</h3>
            
            <div class="form-group">
                <label>Nome da Regra (Para identificação)</label>
                <input type="text" id="regra-nome" class="form-control" placeholder="Ex: Alerta de OPME de Alto Custo">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Tipo de Guia</label>
                    <select id="regra-tipo" class="form-control">
                        <option value="TODAS">Qualquer Guia</option>
                        <option value="guiaSP-SADT">Apenas SP-SADT</option>
                        <option value="guiaConsulta">Apenas Consultas</option>
                        <option value="guiaResumoInternacao">Internação</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Campo a Validar</label>
                    <select id="regra-campo" class="form-control">
                        <option value="valorTotalGeral">Valor Total (R$)</option>
                        <option value="codigoProcedimento">Código do Item/TUSS</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Condição Lógica</label>
                    <select id="regra-condicao" class="form-control">
                        <option value="MAIOR_QUE">Maior Que (>)</option>
                        <option value="IGUAL">Igual a (=)</option>
                        <option value="CONTEM">Contém o texto</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Valor Esperado</label>
                    <input type="text" id="regra-valor" class="form-control" placeholder="Ex: 5000">
                </div>
            </div>

            <div class="form-group">
                <label>Ação do Sistema</label>
                <select id="regra-acao" class="form-control">
                    <option value="ALERTA">⚠️ Gerar Alerta (Amarelo)</option>
                    <option value="BLOQUEIO">❌ Bloquear Guia (Vermelho)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mensagem a exibir para o faturista</label>
                <input type="text" id="regra-mensagem" class="form-control" placeholder="Ex: Revisar com a diretoria médica!">
            </div>

            <button class="btn btn-success" style="width: 100%; margin-top: 10px;" onclick="salvarNovaRegra()">Guardar Regra</button>
            <button class="btn" style="width: 100%; margin-top: 10px; background: #eee; color: #333;" onclick="fecharModal('modalNovaRegra')">Cancelar</button>
        </div>
    </div>

    <script>
        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function fecharModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
    <!-- CARREGAMENTO GLOBAL DO MOTOR JAVASCRIPT -->
    <script src="app.js"></script>
</body>
</html>
